services:
  postgres:
    image: postgres:16-alpine
    container_name: exness-postgres
    environment:
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: exness
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgresql -d exness']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exness-network

  redis:
    image: redis:7-alpine
    container_name: exness-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exness-network

  mongodb:
    image: mongo:7.0
    container_name: exness-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: exness_snapshots
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exness-network

  prisma-studio:
    build:
      context: .
      dockerfile: apps/docker/Backend.Dockerfile
    container_name: exness-prisma-studio
    env_file:
      - apps/docker/env/.env.Backend
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgresql:postgresql@postgres:5432/exness
      FRONTEND_URL: http://localhost:3001
    ports:
      - '5555:5555'
    command: >
      sh -c "
        cd /app/packages/db &&
        bunx prisma studio --hostname 0.0.0.0 --port 5555
      "
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - exness-network
    restart: unless-stopped

  db-migrate:
    build:
      context: .
      dockerfile: apps/docker/Backend.Dockerfile
    container_name: exness-db-migrate
    env_file:
      - apps/docker/env/.env.Backend
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgresql:postgresql@postgres:5432/exness
      FRONTEND_URL: http://localhost:3001
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL...' &&
        until bun run --silent -e 'import pkg from \"pg\"; const {Client} = pkg; const client = new Client({connectionString: process.env.DATABASE_URL}); await client.connect(); await client.end();' 2>/dev/null; do
          sleep 2;
        done &&
        echo 'PostgreSQL is ready!' &&
        cd /app/packages/db &&
        echo 'Running Prisma migrations...' &&
        bun run db:deploy &&
        echo 'Migrations completed!'
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - exness-network
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: apps/docker/Backend.Dockerfile
    container_name: exness-backend
    env_file:
      - apps/docker/env/.env.Backend
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgresql:postgresql@postgres:5432/exness
      FRONTEND_URL: http://localhost:3001
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - exness-network
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: apps/docker/Engine.Dockerfile
    container_name: exness-engine
    env_file:
      - apps/docker/env/.env.Engine
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgresql:postgresql@postgres:5432/exness
      FRONTEND_URL: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - exness-network
    restart: unless-stopped

  snap-shotting:
    build:
      context: .
      dockerfile: apps/docker/Snap_Shotting.Dockerfile
    container_name: exness-snap-shotting
    env_file:
      - apps/docker/env/.env.Snap_Shotting
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgresql:postgresql@postgres:5432/exness
      MONGODB_URL: mongodb://admin:admin123@mongodb:27017/exness_snapshots?authSource=admin
      FRONTEND_URL: http://localhost:3001
    depends_on:
      mongodb:
        condition: service_healthy
      engine:
        condition: service_started
    networks:
      - exness-network
    restart: unless-stopped

  price-poller:
    build:
      context: .
      dockerfile: apps/docker/Price_Poller.Dockerfile
    container_name: exness-price-poller
    env_file:
      - apps/docker/env/.env.Price_Poller
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgresql:postgresql@postgres:5432/exness
      FRONTEND_URL: http://localhost:3001
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - exness-network
    restart: unless-stopped

  websocket-server:
    build:
      context: .
      dockerfile: apps/docker/Websocket_Server.Dockerfile
    container_name: exness-websocket-server
    env_file:
      - apps/docker/env/.env.Websocket_Server
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgresql:postgresql@postgres:5432/exness
      FRONTEND_URL: http://localhost:3001
    ports:
      - '7070:7070'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - exness-network
    restart: unless-stopped

  dbstorage:
    build:
      context: .
      dockerfile: apps/docker/DBstorage.Dockerfile
    container_name: exness-dbstorage
    env_file:
      - apps/docker/env/.env.DBstorage
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgresql:postgresql@postgres:5432/exness
      FRONTEND_URL: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - exness-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
        NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:7070/
    container_name: exness-web
    env_file:
      - apps/docker/env/.env.Web
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgresql:postgresql@postgres:5432/exness
      FRONTEND_URL: http://localhost:3001
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      backend:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    networks:
      - exness-network
    restart: unless-stopped

  docs:
    build:
      context: .
      dockerfile: apps/docker/docs.Dockerfile
    container_name: exness-docs
    env_file:
      - apps/docker/env/.env.Docs
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgresql:postgresql@postgres:5432/exness
      FRONTEND_URL: http://localhost:3001
      PORT: 3000
    ports:
      - '3000:3000'
    networks:
      - exness-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongodb_data:

networks:
  exness-network:
    driver: bridge
